[project]
name = "legalize-kr-graph-rag"
version = "0.1.0"
description = "Finance-law chunking, Apache AGE graph extraction, and ReAct GraphRAG agent."
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "datasets>=5.0.0",
  "deepeval>=3.9.0",
  "ragas>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
