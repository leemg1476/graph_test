services:
  postgres-age:
    image: apache/age:latest
    container_name: legalize-kr-postgres-age
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal}
      POSTGRES_DB: ${POSTGRES_DB:-legal_graph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-age-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal} -d ${POSTGRES_DB:-legal_graph}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-age-data:
