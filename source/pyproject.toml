[project]
name = "woori-poc-agent"
version = "0.1.0"
description = "Read-only MCP server and LangGraph agent for Woori Financial PoC data."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "mcp>=1.2.0",
  "langgraph>=0.2.60",
  "langchain-openai>=0.2.0",
  "langchain-mcp-adapters>=0.1.0",
  "streamlit>=1.36.0",
  "openai>=1.59.0",
  "numpy>=2.0.0",
  "pypdf>=6.0.0",
  "olefile>=0.47",
]

[project.scripts]
woori-graphify = "woori_poc.graphify:main"
woori-semantic-graphify = "woori_poc.semantic_graphify:main"
woori-wiki = "woori_poc.wiki:main"
woori-mcp = "woori_poc.mcp_server:main"
woori-agent-api = "woori_poc.api:main"
woori-agent-ui = "woori_poc.ui_launcher:main"
woori-annex-describe = "woori_poc.annex_describe:main"
woori-collect-supervision = "woori_poc.collect_supervision_materials:main"
woori-build-search = "woori_poc.search_index:main"

[tool.setuptools.packages.find]
where = ["."]
